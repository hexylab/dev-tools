name: 機能・タスク
description: 新機能、改善、作業の起票
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 何が課題か、なぜ今やるのか
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: どうなれば解決か
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Affected Users and Systems
      description: 影響を受ける利用者、サービス、リポジトリ
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: 守るべき条件、対象外とするもの
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 完了を検証できる条件
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: blocked_by
    attributes:
      label: Blocked by
      description: 先に完了している必要がある Issue と、その理由。無ければ「なし」
      value: "なし"
  - type: textarea
    id: questions
    attributes:
      label: Open Questions
